name: Publish to npm with Provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_integration:
        description: 'Skip integration tests'
        required: false
        default: 'false'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run simulator tests with 100% coverage requirement
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # Cross-runtime integration tests
  integration:
    needs: test
    if: github.event.inputs.skip_integration != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            version: '22'
          - runtime: node
            version: '24'
          - runtime: bun
            version: 'latest'
          - runtime: deno
            version: 'v1.x'

    runs-on: ubuntu-latest
    name: Integration (${{ matrix.runtime }} ${{ matrix.version }})
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node' && matrix.version || '22' }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.version }}

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ matrix.version }}

      - name: Install dependencies
        run: npm install

      - name: Run Node.js integration
        if: matrix.runtime == 'node'
        run: node integration/node/run.js

      - name: Run Bun integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/run.ts

      - name: Run Bun security, headers and keepalive integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/security.ts

      - name: Bun security (a peer's error tag builds nothing)
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/security-decode.ts

      - name: Run Bun hot-reload integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/hot-reload.ts

      - name: Run Bun browser-client keepalive integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-keepalive.ts

      - name: Run Bun browser-client connection integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-connect.ts

      - name: Run Bun browser-client calls integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-calls.ts

      - name: Run Bun browser-client page API integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-api.ts

      - name: Run Bun browser-client HTTP streaming integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-streaming.ts

      - name: Run Bun browser-client retry and race integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-race.ts

      - name: Run Bun browser-client hostile-server integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-hostile-server.ts

      - name: Run Bun browser-client errors and controller files integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-errors.ts

      - name: Run Bun browser-client clock skew integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/client-clock-skew.ts

      - name: Run Bun apeBun options integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/options.ts

      - name: Run Bun programmatic controllers integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/controllers.ts

      - name: Run Bun compiled single-file executable integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/compiled-binary.ts

      - name: Run Bun subscribe authorisation integration
        if: matrix.runtime == 'bun'
        run: bun run integration/bun/subscribe.ts

      - name: Run Deno integration
        if: matrix.runtime == 'deno'
        run: deno run --allow-all integration/deno/run.ts

  # Framework integration tests (Express, Next.js, etc.)
  framework-integration:
    needs: test
    if: github.event.inputs.skip_integration != 'true'
    strategy:
      fail-fast: false
      matrix:
        framework: [express, nextjs]

    runs-on: ubuntu-latest
    name: Integration (${{ matrix.framework }})
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install main dependencies
        run: npm install

      - name: Install framework dependencies
        run: cd integration/${{ matrix.framework }} && npm install

      - name: Run ${{ matrix.framework }} integration
        working-directory: integration
        run: node ${{ matrix.framework }}/test.js

  # Publish to npm (only on release events, not workflow_dispatch)
  # workflow_dispatch is for testing the pipeline without publishing
  #
  # Authentication is npm Trusted Publishing (OIDC): there is no npm token. The package's
  # trusted-publisher settings on npmjs.com name this repository and this workflow file
  # (publish.yml, no environment); npm exchanges the job's OIDC identity (id-token: write)
  # for a short-lived publish credential. It needs npm >= 11.5.1, which Node 22's bundled
  # npm is not, hence Node 24 and the explicit npm check below. NODE_AUTH_TOKEN and
  # NPM_TOKEN must stay unset: a token would take precedence over the OIDC exchange.
  publish:
    needs: [test, integration, framework-integration]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports Trusted Publishing (11.5.1 or newer)
        run: |
          npm install -g npm@11
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error('npm ' + process.argv[1] + ' is too old for Trusted Publishing (needs 11.5.1 or newer)');
              process.exit(1);
            }
            console.log('npm ' + process.argv[1]);
          " "$(npm --version)"

      - name: Install dependencies
        run: npm install

      - name: Build browser bundle
        run: npx esbuild client/browser.js --bundle --minify --sourcemap --outfile=dist/ape.js

      - name: Publish to npm with provenance (Trusted Publishing, no token)
        run: npm publish --provenance --access public
